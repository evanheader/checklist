<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#030712" />
    <meta
      name="description"
      content="A dark-themed personal daily checklist app with PST reset."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Daily Checklist</title>
    <link rel="icon" type="image/png" href="assets/catmeme.png" />
    <link rel="apple-touch-icon" href="assets/catmeme.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="phone-shell top-aligned">
      <main class="app">
        <header class="app-header">
          <div>
            <p class="eyebrow">Daily planner</p>
            <h1>My Checklist</h1>
          </div>
          <div class="date-pill" id="todayLabel">Loading…</div>
        </header>

        <section class="add-card">
          <label class="sr-only" for="newItem">Add a checklist item</label>
          <input
            id="newItem"
            type="text"
            maxlength="80"
            placeholder="Add a task"
          />
          <button id="addButton" type="button">Add</button>
        </section>

        <section class="summary" aria-live="polite">
          <span id="progressText">0 of 0 completed</span>
        </section>

        <ul id="checklist" class="checklist"></ul>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
